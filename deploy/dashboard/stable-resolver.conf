[Service]
# Keep the target on a private filesystem when the host replaces /etc/resolv.conf.
TemporaryFileSystem=/etc:ro
BindReadOnlyPaths=/etc/portfolio-public/public-resolv.conf:/etc/resolv.conf /etc/hosts /etc/nsswitch.conf /etc/ssl/certs -/etc/ld.so.cache -/etc/gai.conf -/etc/services -/etc/localtime -/etc/passwd -/etc/group
