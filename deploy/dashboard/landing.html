<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tailnet dashboard · Trey Mouledoux</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #eff4f5;
        background: #0b1014;
        --muted: #b1bec6;
        --line: #34414a;
        --accent: #96e5d4;
        --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        background-image: linear-gradient(#8fb9c307 1px, transparent 1px),
                          linear-gradient(90deg, #8fb9c307 1px, transparent 1px),
                          radial-gradient(ellipse at 85% 0, #172b2f, transparent 56%);
        background-size: 44px 44px, 44px 44px, auto;
      }
      .wrap { width: min(100% - 2.5rem, 62rem); margin-inline: auto; }
      header { border-bottom: 1px solid var(--line); }
      .bar, .brand, nav, .section-heading, .console { display: flex; align-items: center; gap: 1rem; }
      .bar, .section-heading { justify-content: space-between; }
      .bar { min-height: 4.5rem; flex-wrap: wrap; padding-block: .75rem; }
      .brand { gap: .75rem; color: inherit; font-weight: 650; text-decoration: none; }
      .monogram, .terminal { display: grid; flex: none; place-items: center; color: var(--accent); }
      .monogram {
        width: 2.2rem; height: 2.2rem; border: 1px solid #60958d; border-radius: .55rem;
        font: 700 1.1rem var(--mono); letter-spacing: -.1em; padding-right: .1em;
      }
      nav { gap: 1.25rem; }
      nav a { padding-block: .65rem; color: var(--muted); font-size: .9rem; text-decoration: none; }
      nav a[aria-current="page"], a:hover { color: var(--accent); }
      :focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
      main { padding-block: clamp(2.5rem, 8vw, 5.75rem); }
      h1, h2, h3, p { margin: 0; }
      h1 { margin-bottom: clamp(2rem, 5vw, 3.6rem); font-size: clamp(2.4rem, 8vw, 4.3rem); line-height: 1.04; letter-spacing: -.06em; }
      h2 { font-size: 1.25rem; letter-spacing: -.025em; }
      h3 { font-size: 1rem; font-weight: 650; }
      .section-heading { margin-bottom: 1rem; min-height: 2.75rem; }
      .refresh {
        display: inline-flex; align-items: center; min-height: 2.75rem; padding: .6rem .95rem;
        border: 1px solid #54716f; border-radius: .55rem; color: #e4f4f0; background: #1d302f;
        font-size: .85rem; font-weight: 600; text-decoration: none;
      }
      .refresh:hover { border-color: var(--accent); background: #263f3c; }
      iframe { display: block; width: 100%; height: 15rem; border: 0; color-scheme: normal; }
      .console-section { margin-top: 2rem; }
      .console { margin-top: 1.25rem; padding: 1.5rem; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 1rem; background: #121b21; }
      .terminal { width: 2.75rem; height: 2.75rem; border: 1px solid var(--line); border-radius: .6rem; font: 600 1rem var(--mono); }
      .console-copy { flex: 1 1 14rem; min-width: 0; overflow-wrap: anywhere; }
      .console-copy p { margin-top: .35rem; color: var(--muted); font-size: .9rem; line-height: 1.55; }
      code { display: block; margin-top: .8rem; padding: .7rem .9rem; border: 1px solid var(--line); border-radius: .5rem; color: var(--accent); background: #0d151a; font: .87rem/1.5 var(--mono); }
      @media (max-width: 44.5rem) {
        iframe { height: 24.5rem; }
        .console { align-items: flex-start; }
      }
      @media (max-width: 28rem) {
        .bar { row-gap: 0; }
        iframe { height: 26rem; }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="wrap bar">
        <a class="brand" href="/"><span class="monogram" aria-hidden="true">tm</span>Trey Mouledoux</a>
        <nav aria-label="Dashboard">
          <a href="/dashboard" aria-current="page">Overview</a>
          <a href="/dashboard/messages">Messages</a>
        </nav>
      </div>
    </header>
    <main class="wrap">
      <h1>Tailnet dashboard</h1>
      <section aria-labelledby="services">
        <div class="section-heading">
          <h2 id="services">Service status</h2>
          <a class="refresh" href="/dashboard">Refresh status</a>
        </div>
        <iframe title="Private service status" sandbox="" referrerpolicy="no-referrer"
          src="https://status.example.invalid:8443/embed/status"></iframe>
      </section>
      <section class="console-section" aria-labelledby="ssh">
        <h2 id="ssh">Remote access</h2>
        <div class="console">
          <span class="terminal" aria-hidden="true">&gt;_</span>
          <div class="console-copy">
            <h3>Raspberry Pi SSH</h3>
            <p>Run this command in Terminal on your authorized Mac or PC. Your iPhone has read-only dashboard access.</p>
            <code>ssh PI_SSH_USER@status.example.invalid</code>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
