<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · Trey Mouledoux</title>
  <style>
    :root { color-scheme: dark; font: 1rem/1.5 system-ui, sans-serif; background: #10141a; color: #f3f6f8; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { margin: 0 auto; padding: clamp(2rem, 9vh, 6rem) 1.25rem; max-width: 54rem; }
    h1 { font-size: clamp(2.5rem, 7vw, 4rem); letter-spacing: -.045em; line-height: 1.05; }
    iframe { display: block; width: 100%; height: 18rem; border: 1px solid #39414c; border-radius: 1rem; }
    nav { display: flex; gap: 1.5rem; flex-wrap: wrap; margin-top: 1.5rem; }
    a { color: #b9e5dc; text-underline-offset: .25em; }
    a:focus-visible { outline: 2px solid currentColor; outline-offset: .35rem; }
    @media (max-width: 36rem) { iframe { height: 23rem; } }
  </style>
</head>
<body>
  <main>
    <h1>Dashboard</h1>
    <iframe title="Private service status" sandbox="" referrerpolicy="no-referrer"
      src="https://status.example.invalid:8443/embed/status"></iframe>
    <nav aria-label="Dashboard links">
      <a href="https://status.example.invalid:8443/" rel="noreferrer">Open private dashboard</a>
      <a href="/">Back to portfolio</a>
    </nav>
  </main>
</body>
</html>
