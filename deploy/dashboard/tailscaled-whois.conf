# /etc/systemd/system/tailscaled.service.d/portfolio-whois.conf
# For the root daemon with RuntimeDirectory=tailscale; portfolio-deploy must
# be the only non-root member of its private primary group.
[Service]
RuntimeDirectoryMode=0700
ExecStartPost=/usr/bin/install -d -o root -g portfolio-deploy -m 0710 /run/tailscale
