<!doctype html>
<html lang="en" data-private-origin="https://status.example.invalid">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Private dashboard · Trey Mouledoux</title>
    <style>
      :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; background: #0b0c10; color: #f5f3f5; }
      body { margin: 0; display: grid; place-items: center; min-height: 100vh; min-height: 100svh; text-align: center;
        background: radial-gradient(ellipse at center, #361c25, transparent 65%); }
      main { max-width: 31rem; padding: 2rem 1.25rem; }
      .badge { display: inline-grid; place-items: center; width: 3rem; height: 3rem; border-radius: .95rem;
        border: 1px solid #4b2f38; background: #221820; color: #ffacaf; }
      .badge svg { width: 1.45rem; height: 1.45rem; }
      small { display: block; margin-top: 1rem; color: #ffabac; font: .9rem ui-monospace, monospace; }
      h1 { margin: .65rem 0; line-height: 1.15; font-size: clamp(1.6rem, 5vw, 2.1rem); letter-spacing: -.02em; }
      p { line-height: 1.6; color: #bfc0ce; }
      p.note { font-size: .87rem; color: #8f93a3; }
      a.button { display: inline-block; margin-top: .5rem; padding: .7rem 1.1rem; border-radius: .6rem;
        border: 1px solid #4b2f38; background: #221820; color: #ffacaf; text-decoration: none; font-size: .9rem; }
      a.button:focus-visible, a.button:hover { outline: 2px solid #ffacaf; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <span class="badge" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" focusable="false">
          <rect x="4" y="10" width="16" height="10" rx="2.5"/>
          <path d="M8 10V7.5a4 4 0 0 1 8 0V10"/>
          <path d="M12 14.5v2.5"/>
        </svg>
      </span>
      <small>Private dashboard</small>
      <h1>Connect to Tailscale to open this dashboard</h1>
      <p>The dashboard resolves only inside the tailnet, and Tailscale must be connected on this device with an approved account. Nothing about this site is served publicly.</p>
      <p class="note" id="opening">Checking for the dashboard on this device…</p>
      <a class="button" href="https://status.example.invalid/">Open the dashboard</a>
    </main>
    <script>
      (() => {
        const origin = document.documentElement.dataset.privateOrigin;
        const control = document.getElementById("opening");
        if (!origin) return;
        const abort = new AbortController();
        const timer = setTimeout(() => abort.abort(), 1500);
        // A no-cors request can only succeed when the private origin actually
        // answers, which requires the tailnet. An opaque response is enough.
        fetch(origin + "/handoff", {
          mode: "no-cors",
          cache: "no-store",
          credentials: "omit",
          signal: abort.signal
        }).then(() => {
          window.location.replace(origin + "/");
        }).catch(() => {
          if (control) control.remove();
        }).finally(() => clearTimeout(timer));
      })();
    </script>
  </body>
</html>
