[Service]
# 90-stable-resolver.conf replaces /etc with a private read-only tmpfs, so the
# public service cannot see the dashboard's editable recipient list unless the
# directory is named here. Bind the directory and not the file: the dashboard's
# host agent replaces the file atomically, which a single-file bind would pin to
# the old inode. The leading '-' keeps a host without the list bootable.
BindReadOnlyPaths=-/etc/portfolio-contact