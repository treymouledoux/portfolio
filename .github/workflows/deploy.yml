name: Deploy Portfolio

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Grant permissions for the OIDC JWT token
permissions:
  id-token: write
  contents: read

concurrency:
  group: portfolio-production
  cancel-in-progress: false

env:
  TARGET: aarch64-unknown-linux-gnu   # Pi Zero 2 W (64-bit)
  BIN_NAME: portfolio-serve           # Cargo package name
  REMOTE_DIR: /home/trey/portfolio-deployment

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # ---------- BUILD FRONTEND (Next.js with pnpm) ----------
      # pnpm/setup@v2 is the successor to pnpm/action-setup for pnpm v11+. It
      # installs pnpm's self-contained binary AND Node.js in one step (replacing
      # actions/setup-node), and auto-runs `pnpm install` on the package.json
      # it's pointed at.
      - name: Set up pnpm and Node
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          cache-dependency-path: portfolio-static/pnpm-lock.yaml
          package-json-file: portfolio-static/package.json
          install: false

      - name: Build frontend
        working-directory: portfolio-static
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          node ../scripts/precompress.mjs out

      # ---------- BUILD RUST (cross-compiled on the x86 runner) ----------
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install aarch64 linker
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: portfolio-serve
          key: ${{ env.TARGET }}

      - name: Check and test backend
        working-directory: portfolio-serve
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          python3 ../scripts/test-deployment.py

      - name: Cross-compile release binary
        working-directory: portfolio-serve
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --locked --release --target ${{ env.TARGET }} --bin ${{ env.BIN_NAME }}

      - name: Stage artifacts for upload
        run: |
          mkdir -p stage
          # The compiled binary
          cp portfolio-serve/target/${{ env.TARGET }}/release/${{ env.BIN_NAME }} stage/
          # The systemd units
          cp deploy/portfolio.service stage/
          cp deploy/cloudflared.service stage/
          cp deploy/activate-release.sh stage/
          # Copy the compiled Next.js static output (out/) into assets/ next to the binary
          cp -r portfolio-static/out stage/assets
          (cd stage && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)

      # ---------- CONNECT ----------
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci

      - name: Write SSH key and known_hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEVICE_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEVICE_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Upload complete release while current site stays online
        env:
          DEVICE_HOST: ${{ secrets.DEVICE_HOST }}
          DEVICE_USERNAME: ${{ secrets.DEVICE_USERNAME }}
          RELEASE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          remote="$DEVICE_USERNAME@$DEVICE_HOST"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$remote" \
            "mkdir -p '$REMOTE_DIR/releases/$RELEASE_ID'"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -r stage/. \
            "$remote:$REMOTE_DIR/releases/$RELEASE_ID/"

      - name: Activate release with health check and rollback
        env:
          DEVICE_HOST: ${{ secrets.DEVICE_HOST }}
          DEVICE_USERNAME: ${{ secrets.DEVICE_USERNAME }}
          RELEASE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DEVICE_USERNAME@$DEVICE_HOST" \
            "bash '$REMOTE_DIR/releases/$RELEASE_ID/activate-release.sh' '$REMOTE_DIR' '$RELEASE_ID'"
