name: Check private dashboard

on:
  pull_request:
    paths:
      - 'portfolio-dashboard/**'
      - 'deploy/dashboard/**'
      - 'portfolio-serve/src/dashboard-denied.html'
      - 'scripts/check-dashboard-styles.py'
      - '.github/workflows/dashboard.yml'
  push:
    branches: [main]
    paths:
      - 'portfolio-dashboard/**'
      - 'deploy/dashboard/**'
      - 'portfolio-serve/src/dashboard-denied.html'
      - 'scripts/check-dashboard-styles.py'
      - '.github/workflows/dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 20
    defaults:
      run:
        working-directory: portfolio-dashboard
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: python3 ../scripts/check-dashboard-styles.py
      - run: cargo build --locked --release
      - name: Package reviewed executable
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: tar -C target/release -czf portfolio-dashboard-linux-arm64.tar.gz portfolio-dashboard
      - name: Retain manual ARM64 build
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: portfolio-dashboard-linux-arm64-${{ github.sha }}
          path: portfolio-dashboard/portfolio-dashboard-linux-arm64.tar.gz
          if-no-files-found: error
          retention-days: 3
