name: Check private dashboard

on:
  pull_request:
    paths:
      - 'portfolio-dashboard/**'
      - 'deploy/dashboard/**'
      - 'portfolio-serve/src/dashboard-denied.html'
      - 'portfolio-serve/src/dashboard-tailnet.html'
      - 'scripts/check-dashboard-styles.py'
      - '.github/workflows/dashboard.yml'
  push:
    branches: [main]
    paths:
      - 'portfolio-dashboard/**'
      - 'deploy/dashboard/**'
      - 'portfolio-serve/src/dashboard-denied.html'
      - 'portfolio-serve/src/dashboard-tailnet.html'
      - 'scripts/check-dashboard-styles.py'
      - '.github/workflows/dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 20
    defaults:
      run:
        working-directory: portfolio-dashboard
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: python3 ../scripts/check-dashboard-styles.py
      - run: python3 -B ../deploy/dashboard/test_host_guard.py
      - run: python3 -B ../deploy/dashboard/test_muse_status.py
      - run: python3 -B ../deploy/dashboard/test_whois_helper.py
      - name: Test passkey verification and contact removal
        run: |
          python3 -m venv "$RUNNER_TEMP/inbox-test"
          "$RUNNER_TEMP/inbox-test/bin/pip" install 'fido2==1.2.0'
          "$RUNNER_TEMP/inbox-test/bin/python" -B ../deploy/dashboard/test_inbox_actions.py
      - run: python3 -B ../deploy/dashboard/acme-test-install.py
      - name: Exercise gateway and split DNS with local fixtures
        shell: bash
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          curl -fsSL --retry 2 -o "$work/caddy.tgz" https://github.com/caddyserver/caddy/releases/download/v2.11.9/caddy_2.11.9_linux_arm64.tar.gz
          curl -fsSL --retry 2 -o "$work/coredns.tgz" https://github.com/coredns/coredns/releases/download/v1.15.0/coredns_1.15.0_linux_arm64.tgz
          echo "5e377cff994fc9362a6fcf695c53f226cfca3a3ef85bd3a3687cf252d6310165  $work/caddy.tgz" | sha256sum --check -
          echo "73a5bf107c9791d57741ccd59ad138ab00bcd5bb3f62e2e28c999f5c047334a4  $work/coredns.tgz" | sha256sum --check -
          tar -C "$work" -xzf "$work/caddy.tgz" caddy
          tar -C "$work" -xzf "$work/coredns.tgz" coredns
          python3 -B ../deploy/dashboard/test_gateway.py --caddy "$work/caddy" --coredns "$work/coredns"
      - run: cargo build --locked --release
      - name: Package reviewed executable
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: tar -C target/release -czf portfolio-dashboard-linux-arm64.tar.gz portfolio-dashboard
      - name: Retain manual ARM64 build
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: portfolio-dashboard-linux-arm64-${{ github.sha }}
          path: portfolio-dashboard/portfolio-dashboard-linux-arm64.tar.gz
          if-no-files-found: error
          retention-days: 3
