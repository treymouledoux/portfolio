[package]
name = "portfolio-serve"
version = "0.5.0"
edition = "2024"

[dependencies]
axum = "0.8.*"
tokio = { version = "1.*.*", features = ["full"] }
tower-http = { version = "0.7.*", features = ["fs", "compression-full"] }
serde = { version = "1.0.*", features = ["derive"] }
chrono = "0.4.*"
serde_json = "1.0.*"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls", "ring", "webpki-roots", "serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
